# Secrets are read from the environment with the ${VAR:?message} form, which makes
# `docker compose` refuse to render at all when a value is missing rather than starting
# on a committed default (S1 / P0-SEC-02). Source your .env before running:
#   set -a && . ./.env && set +a && docker compose up
services:
  db:
    image: postgres:16-alpine
    container_name: kinetix_identity_db
    restart: always
    environment:
      POSTGRES_DB: kinetix_identity_dev
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d kinetix_identity_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: kinetix_identity_web
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME:?DB_USERNAME is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_DATABASE=kinetix_identity_dev
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_EXPIRES_IN=86400s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_identity_data:
