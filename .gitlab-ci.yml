# Kinetix identity CI — GitLab.
#
# ⚠ PAIRED FILE: .github/workflows/ci.yml
# `origin` is GitHub and GitLab is a mirror, so GitHub Actions is the pipeline that gates
# merges; this one runs on the mirror. They assert the SAME THINGS and must be changed
# together. If you edit one and not the other, the two platforms disagree about whether the
# same commit is good — which is worse than having only one.
#
# The job that matters here is `migrations`. Identity had no migrations at all until S3 —
# `synchronize: false` with an empty migrations directory, so the schema was never created.

include:
  - project: 'WildanFrananda/kinetix-infrastructure'
    ref: main
    file: '/ci/service-ci.yml'

stages:
  - verify
  - build
  - test

# Bun installs, and jest runs on Node, as it does on GitHub's runner, where Node is present and
# `bunx jest` follows jest's `node` shebang. Jest cannot set up its environment under Bun (it reads
# `ReadableStreamDefaultReader.closed` off the prototype and throws), so a job with no Node could
# not run a single spec. Node comes from the pinned image's own Alpine release.
.bun:
  image: oven/bun:1-alpine@sha256:07235578f79ef8c6f97d94aee7938e76f5cdba5f21ae5dbfdd3d3d38058437eb
  before_script:
    - apk add --no-cache nodejs
    - bun install --frozen-lockfile

secret-scan:
  extends: .secret-scan

build-image:
  extends: .build-image

typecheck:
  extends: .bun
  stage: verify
  # `nest build` runs tsc with the project's strict settings. It must not be masked: the
  # Dockerfile used to fall back to `|| tsc`, producing an image whose entry point did not
  # exist while reporting success.
  script:
    - bun run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

unit:
  # One lockfile: bun installs, jest runs on Node (see .bun above and .github/workflows/ci.yml).
  extends: .bun
  stage: test
  script:
    - bunx jest --config jest.config.cjs
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

migrations:
  extends: .bun
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci-ephemeral-not-a-deployed-credential
    POSTGRES_DB: kinetix_identity_dev
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_USERNAME: ci
    DB_PASSWORD: ci-ephemeral-not-a-deployed-credential
    DB_DATABASE: kinetix_identity_dev
  script:
    - bun run build
    - bun dist/migrate.js
    # A second run must apply nothing. If it does, the migrations are not idempotent.
    - bun dist/migrate.js | grep -q 'schema is up to date'
    # Needs the database, which is why it is here and not in the unit job: the failure it guards —
    # a cursor that reads the same merchant for ever — happens between Postgres and the driver, so
    # a test with a fake repository passes either way and proves nothing. The files share one
    # database and each clears the tables it reads, so they run one at a time.
    - KINETIX_TEST_POSTGRES=1 bunx jest --config jest.config.cjs --runInBand test/merchant_cursor_precision.spec.ts test/merchant_change_transaction.spec.ts test/refresh_rotation_race.spec.ts test/account_writes.spec.ts test/database_outage.spec.ts
    # The drift gate. `migration:generate` exits non-zero with "No changes in database schema
    # were found" when entities and schema agree — so a SUCCESSFUL generate means someone
    # changed an entity without writing the migration. Any other failure is not "no drift" and
    # fails too; until 2026-10-19 it passed. `--bun` keeps the CLI on Bun now that Node is installed
    # here as on GitHub's runner, because Node cannot load `src/data-source.ts`.
    - |
      if output="$(bunx --bun typeorm migration:generate -d src/data-source.ts src/migrations/DriftCheck 2>&1)"; then
        echo "entities have drifted: a migration was generated that is not committed"
        cat src/migrations/*DriftCheck.ts
        exit 1
      fi
      if ! printf '%s\n' "$output" | grep -q "No changes in database schema were found"; then
        echo "the drift check failed before it compared anything:"
        printf '%s\n' "$output"
        exit 1
      fi
      echo "no drift: the committed migrations describe the entities exactly"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
